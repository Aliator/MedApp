name: Pages
# Two demos on GitHub Pages, neither touching the API, a database server or a secret:
# - the light demo (https://aliator.github.io/MedApp/): the React app with a stand-in API in the browser
#   (`npm run build:demo`, docs/agents/light-demo.md);
# - the full demo (https://aliator.github.io/MedApp/full/): the React app on the real backend compiled to
#   WebAssembly with SQLite (`MedApp.Browser`), its demo database made by the full app's seeder
#   (docs/full-browser-demo-plan.md).
# On each push to main that changes either, nightly (so the full demo's dated demo data stays current), and by hand.
# Pages must be set to deploy from GitHub Actions in the repository's settings.
on:
  push:
    branches: [ main ]
    paths:
      - 'MedApp.Web/**'
      - 'MedApp.Browser/**'
      - 'MedApp.Application/**'
      - 'MedApp.Infrastructure/**'
      - 'MedApp.Domain/**'
      - 'MedApp.Contracts/**'
      - 'MedApp.API/**'
      - 'tools/MedApp.BrowserDb/**'
      - 'tools/MedApp.DevMcp/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
# Each job asks for only what it needs.
permissions: {}
# One deploy at a time; a newer one waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: MedApp.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Links SQLite into the WebAssembly runtime (Emscripten).
      - name: Install the WebAssembly build tools
        working-directory: .
        run: dotnet workload install wasm-tools

      - name: Publish the in-browser backend
        working-directory: .
        run: dotnet publish MedApp.Browser -c Release -o "$RUNNER_TEMP/backend"

      # The full app's seeder against SQLite, dated today: medapp.db.gz and db-version.json.
      - name: Build the demo database
        working-directory: .
        run: dotnet run --project tools/MedApp.BrowserDb -c Release -- --out "$RUNNER_TEMP/demo-db"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MedApp.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Client only, under /MedApp/.
      - name: Build the light demo
        run: npm run build:demo

      # Client only, under /MedApp/full/, with the backend's files and the database copied in.
      - name: Build the full demo
        run: npm run build:full-demo
        env:
          FULL_DEMO_BACKEND: ${{ runner.temp }}/backend/wwwroot
          FULL_DEMO_DATABASE: ${{ runner.temp }}/demo-db

      # Both in one site; Pages serves only the top 404.html, so it loads whichever app the address is under.
      - name: Put the two together
        run: node scripts/assemble-pages.mjs dist-demo dist-full-demo "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
