# The Helm chart's values (deploy/helm/medapp) for AKS (deploy/azure). Argo CD deploys them from the env/azure
# branch, with the image from deploy/argocd/azure-image.yaml (written by the Publish workflow).
#
# deploy.sh prints three values that are only known once main.bicep has run: fill them in below (each marked
# "deploy.sh") and merge that to main before MedApp's first deploy (README.md, step 6). Without them the API sends no
# email (with no from address, the app hides its email features) and stores its data protection keys unwrapped; keys
# made unwrapped stay that way, in the database, until they expire.
api:
  # Two copies, spread across the nodes where the scheduler can (the chart prefers different nodes for them), sharing
  # live notifications through the backplane (Valkey, in the cluster).
  replicas: 2
  # The page server in a container of its own beside the API, in each pod, with none of the API's secrets (the
  # chart's default, set here so it stays that way).
  pageServer:
    enabled: true
  # Workload ID: the API signs in to Key Vault as main.bicep's API identity. deploy.sh: its apiClientId output.
  workloadIdentity:
    clientId: ""

# Azure Communication Services' SMTP relay (main.bicep), signed in to as the Entra app's SMTP user name with its
# client secret, both from Key Vault (medapp-email). Links in emails start with https://<ingress.host>.
email:
  # The Azure-managed domain's sender. deploy.sh: its emailSenderAddress output (DoNotReply@<...>.azurecomm.net).
  fromAddress: ""
  # The managed domain allows 10 emails an hour for the whole subscription: stay under it, so the quota isn't the
  # first limit a flood of reset requests meets (2 of these are kept for security notices). Raise it with a custom
  # domain (100 an hour).
  maxPerHour: 8
  smtp:
    host: smtp.azurecomm.net
    port: 587
    security: StartTls
    auth:
      enabled: true

# The data protection keys, in Azure SQL, wrapped with Key Vault's key. deploy.sh: its dataProtectionKeyUri output.
dataProtection:
  keyVaultKeyUri: ""

ingress:
  enabled: true
  className: traefik
  # Your domain: point its DNS at the ingress's public IP (bootstrap.sh prints it).
  host: medapp.example.com
  tls:
    enabled: true
    # Let's Encrypt (bootstrap.sh), for a certificate browsers trust.
    clusterIssuer: letsencrypt

# Azure SQL, not SQL Server in the cluster.
sql:
  enabled: false

# Every secret from Key Vault (main.bicep makes them), through External Secrets Operator signed in with workload
# identity (bootstrap.sh). Azure SQL has no sa password to pass on.
externalSecrets:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  database:
    sa-password: null

networkPolicy:
  ingressController:
    namespace: traefik
  # Azure SQL's private endpoint (main.bicep's private-endpoints subnet), for the API and the migrations Job.
  extraEgress:
    - to:
        - ipBlock:
            cidr: 10.40.4.0/24
      ports:
        - port: 1433
          protocol: TCP
  # The SMTP relay (smtp.azurecomm.net:587), the vault (443) and Microsoft Entra ID (login.microsoftonline.com:443) by
  # name, not every public address on those ports: a CiliumNetworkPolicy, which needs main.bicep's Advanced Container
  # Networking Services security (FQDN filtering) on the cluster.
  fqdnEgress:
    enabled: true
