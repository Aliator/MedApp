name: E2E tests
# Runs by hand, against an app that is already running somewhere (plan Q13), signed in as an admin from the
# E2E_USERNAME and E2E_PASSWORD repository secrets. Those secrets don't exist yet: create them for the deployment
# before using this (without them the run fails, never skips). The tests make their own synthetic data there and delete
# what the app can delete (MedApp.E2ETests/README.md lists what stays). No traces are saved here: they would record the
# real credentials. main.yml's e2e job runs the same tests against the production image itself (on main, and on a
# pull request labelled ci:full).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL of the running MedApp to test
        required: true
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MedApp.E2ETests --configuration Release

      - name: Install Chromium
        run: pwsh MedApp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run end-to-end tests
        run: dotnet test MedApp.E2ETests --configuration Release --no-build
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
