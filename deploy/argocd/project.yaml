# The Argo CD project MedApp's Applications belong to (medapp-kind.yaml, medapp-azure.yaml), applied before them by
# deploy/kind/up.sh --argocd and deploy/azure/bootstrap.sh. Argo CD applies whatever lands on an environment branch
# with its own cluster-wide rights; this project limits that to what MedApp's chart is meant to deploy: from this
# repository only, into the medapp namespace only, and only the kinds the chart renders. Anything else on the
# branch (another namespace, a ClusterRole, a webhook) fails the sync instead of being applied.
#
# A new kind in the chart needs adding here first, or its sync fails with "resource ... is not permitted in project
# medapp". List what the chart renders with, for example:
#   helm template medapp deploy/helm/medapp --values deploy/azure/values.yaml --set image.tag=ci | grep -E '^(apiVersion|kind):'
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: medapp
  namespace: argocd
spec:
  description: MedApp, deployed from its environment branches.
  sourceRepos:
    - https://github.com/Aliator/MedApp.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: medapp
  # Cluster-wide: nothing, not even a Namespace. The medapp namespace, with its "restricted" Pod Security labels, is
  # made by deploy/kind/up.sh --argocd and deploy/azure/bootstrap.sh, which run as cluster admin. If Argo CD could
  # apply a Namespace, a commit on an environment branch could relabel medapp to allow privileged pods.
  clusterResourceWhitelist: []
  # In the namespace: what the chart renders, with kind's, Azure's and the default values.
  namespaceResourceWhitelist:
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    # Only the API's, for Azure's workload identity (api.workloadIdentity). It gets no Kubernetes rights: the
    # project allows no Role or RoleBinding.
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    # Only with Azure's values: the API's egress by name (networkPolicy.fqdnEgress). Namespaced, so it can only
    # change what pods in medapp may connect to, as a NetworkPolicy can.
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: external-secrets.io
      kind: ExternalSecret
