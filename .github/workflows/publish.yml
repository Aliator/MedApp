name: Publish
# On each merge to main: build the API's image (MedApp.API/Dockerfile), push it to GHCR tagged with the commit, and
# deploy it by moving the environment branches Argo CD follows (deploy/argocd/README.md):
#   - env/kind, always (the deploy-kind job)
#   - env/azure, once the Azure setup exists (deploy/azure/README.md): the image is copied to Azure Container Registry
# The two deploys are separate jobs that each need only the image, so one failing doesn't stop the other.
# main only changes through pull requests, so each environment's deployed state lives on its own branch
# (.github/scripts/deploy-to-env.sh).
# It only ever deploys main. Started by hand (workflow_dispatch) on another branch, it still builds that branch's
# image and pushes it to GHCR, tagged with the commit, but moves no environment branch: both deploy jobs are skipped.
# A push that changes nothing that goes into the image or the chart deploys nothing: docs, tests, tools/ and .github/
# (but for this workflow and the script it runs). The environment branches then stay a commit of main behind in those
# files only, until the next deploy brings them.
on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tools/**'
      - '!MedApp.UnitTests/**'
      - '!MedApp.IntegrationTests/**'
      - '!MedApp.E2ETests/**'
      - '!.github/**'
      - '.github/workflows/publish.yml'
      - '.github/scripts/deploy-to-env.sh'
  workflow_dispatch:
# Each job asks for only what it needs.
permissions: {}
concurrency:
  # One run at a time, in order. Re-running an older run deploys nothing: deploy-to-env.sh never moves an environment
  # branch back to an older commit of main. Roll back by reverting the change on main, which deploys as usual.
  group: publish
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/aliator/medapp-api
jobs:
  # The image, then its SBOM and two signed attestations, both stored on GitHub and pushed to GHCR beside the image:
  # build provenance (which workflow run, commit and repository built this digest) and the SBOM. Check them with
  # `gh attestation verify oci://ghcr.io/aliator/medapp-api:<commit> --repo Aliator/MedApp`.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # check out the code
      packages: write     # push to GHCR (the image and its attestations)
      id-token: write     # sign the attestations (Sigstore, through GitHub's OIDC token)
      attestations: write # store the attestations on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: MedApp.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The SBOM (SPDX JSON) of exactly what was pushed: Syft reads the image back from GHCR by its digest.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: medapp-api.spdx.json
          # Uploaded below, under a name of our choosing; and this never runs for a release.
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medapp-api-sbom
          path: medapp-api.spdx.json

      # actions/attest rather than attest-build-provenance and attest-sbom: since v4 those two are thin wrappers around
      # it, and attest-sbom is deprecated in its favour. With no sbom-path it attests SLSA build provenance.
      # No storage record: GitHub only keeps those for organisations' packages, and this repository is a user's.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: medapp-api.spdx.json
          push-to-registry: true
          create-storage-record: false

  # kind: moves env/kind to this commit with the new image. The image on GHCR is public, so it needs no packages
  # permission.
  deploy-kind:
    needs: image
    # Only from main: a manual run on another branch deploys nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to env/kind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all history: the deploy commit's parents are env/kind's tip and this commit

      - name: Deploy to kind (env/kind)
        run: .github/scripts/deploy-to-env.sh env/kind deploy/argocd/kind-image.yaml "$IMAGE" kind

  # Azure: skipped until the repository variables below are set (deploy/azure/README.md, after deploy.sh). It signs
  # in to Azure as the GitHub identity main.bicep made (OIDC: no stored secret), which may only push to the registry.
  azure:
    needs: image
    # Only from main (a manual run on another branch deploys nothing), and only once Azure is set up.
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to env/azure
      id-token: write   # sign in to Azure with OIDC
    env:
      ACR_IMAGE: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/medapp-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all history: the deploy commit's parents are env/azure's tip and this commit

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Copy the image to Azure Container Registry
        run: |
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"
          # The image the image job built and pushed (public on GHCR), copied as is: the same digest runs everywhere.
          docker buildx imagetools create --tag "$ACR_IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"

      - name: Deploy to Azure (env/azure)
        run: .github/scripts/deploy-to-env.sh env/azure deploy/argocd/azure-image.yaml "$ACR_IMAGE" azure
