name: PR Unit Tests & Coverage
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: write
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Run unit tests with coverage
        run: |
          dotnet test MedApp.UnitTests \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
      
      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'Html;MarkdownSummaryGithub;Cobertura'
          assemblyfilters: '+MedApp.*;-MedApp.Contracts;-MedApp.API'
          filefilters: '-**/Migrations/*.cs;-**/Program.cs;-**/Startup.cs'
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
      
      - name: Create detailed coverage comment
        run: |
          echo "## 📊 Coverage Report" > coverage-details.md
          echo "" >> coverage-details.md
          cat coverage-report/SummaryGithub.md >> coverage-details.md
          echo "" >> coverage-details.md
          echo "### 📉 Classes Below 80% Coverage" >> coverage-details.md
          echo "" >> coverage-details.md
          echo "| Class | Line Coverage | Branch Coverage |" >> coverage-details.md
          echo "|-------|---------------|-----------------|" >> coverage-details.md
          
          # Parse Cobertura XML for class-level coverage
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          
          tree = ET.parse('coverage-report/Cobertura.xml')
          root = tree.getroot()
          
          classes_below_threshold = []
          
          for package in root.findall('.//package'):
              for cls in package.findall('.//class'):
                  class_name = cls.get('name')
                  line_rate = float(cls.get('line-rate', 0)) * 100
                  branch_rate = float(cls.get('branch-rate', 0)) * 100 if cls.get('branch-rate') else 100
                  
                  if line_rate < 80:
                      classes_below_threshold.append((class_name, line_rate, branch_rate))
          
          # Sort by line coverage (lowest first)
          classes_below_threshold.sort(key=lambda x: x[1])
          
          # Write to markdown
          with open('coverage-details.md', 'a') as f:
              if classes_below_threshold:
                  for class_name, line_cov, branch_cov in classes_below_threshold:
                      f.write(f"| `{class_name}` | {line_cov:.1f}% | {branch_cov:.1f}% |\n")
              else:
                  f.write("| *All classes above 80% coverage!* 🎉 | - | - |\n")
          EOF
      
      - name: Comment PR with coverage summary
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: coverage-details.md
