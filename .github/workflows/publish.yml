name: Publish
# On each merge to main: build the API's image (MedApp.API/Dockerfile), push it to GHCR tagged with the commit, and
# deploy it by moving the environment branches Argo CD follows (deploy/argocd/README.md):
#   - env/kind, always
#   - env/azure, once the Azure setup exists (deploy/azure/README.md): the image is copied to Azure Container Registry
# main only changes through pull requests, so each environment's deployed state lives on its own branch
# (.github/scripts/deploy-to-env.sh).
# It only ever deploys main. Started by hand (workflow_dispatch) on another branch, it still builds that branch's
# image and pushes it to GHCR, tagged with the commit, but moves no environment branch and skips the azure job.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write   # push to the environment branches
  packages: write   # push to GHCR
concurrency:
  # One at a time, in order, so each environment branch always ends on the newest commit.
  group: publish
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/aliator/medapp-api
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all history: the deploy commit's parents are env/kind's tip and this commit

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MedApp.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to kind (env/kind)
        if: github.ref == 'refs/heads/main'
        run: .github/scripts/deploy-to-env.sh env/kind deploy/argocd/kind-image.yaml "$IMAGE" kind

  # Azure: skipped until the repository variables below are set (deploy/azure/README.md, after deploy.sh). It signs
  # in to Azure as the GitHub identity main.bicep made (OIDC: no stored secret), which may only push to the registry.
  azure:
    needs: image
    # Only from main (a manual run on another branch deploys nothing), and only once Azure is set up.
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to env/azure
      id-token: write   # sign in to Azure with OIDC
    env:
      ACR_IMAGE: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/medapp-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all history: the deploy commit's parents are env/azure's tip and this commit

      - uses: docker/setup-buildx-action@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Copy the image to Azure Container Registry
        run: |
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"
          # The image the image job built and pushed (public on GHCR), copied as is: the same digest runs everywhere.
          docker buildx imagetools create --tag "$ACR_IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"

      - name: Deploy to Azure (env/azure)
        run: .github/scripts/deploy-to-env.sh env/azure deploy/argocd/azure-image.yaml "$ACR_IMAGE" azure
