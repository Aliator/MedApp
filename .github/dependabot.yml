# Dependabot: monthly pull requests that update dependencies, one ecosystem at a time. Updates are grouped so there
# are few pull requests: minor and patch updates in one per ecosystem, and major updates in another (across every
# directory of that ecosystem), since a major update may need code changes and gets a closer look. The trade-off: when
# a grouped pull request breaks something, the package at fault has to be found by hand. Security updates (for a known
# advisory) are separate: they come as soon as there's an advisory, without waiting for the schedule or the cooldown.
# They, Dependabot alerts and dependency review (main.yml) need the repository's dependency graph, Dependabot alerts
# and Dependabot security updates on (Settings, Advanced Security), which they are since #67 (docs/todo.md,
# Repository settings).
#
# At most 5 pull requests are open per ecosystem (open-pull-requests-limit), so closing some lets the next ones out.
#
# cooldown: a new version is only proposed once it has been out for a week. A hijacked release (like Trivy's, in March
# 2026) is usually found and pulled within days, so this keeps one from arriving here in a routine update.
version: 2
updates:
  # The actions the workflows use. They're pinned to commit SHAs with the tag in a comment, and Dependabot updates
  # both. (Not the Trivy image in main.yml, which is a docker run: that one is bumped by hand.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # The .NET projects: MedApp.sln at the root, and the dev MCP tool, which isn't in the solution.
  - package-ecosystem: nuget
    directories:
      - /
      - /tools/MedApp.DevMcp
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Aspire's packages are released together and must stay on one version, as must the AppHost's
      # Sdk="Aspire.AppHost.Sdk/<version>" (check it in the pull request).
      aspire:
        patterns: ["Aspire.*"]
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # A new .NET major version (ASP.NET Core, EF Core, the Microsoft.Extensions packages) needs the new SDK and
      # target framework: that's a deliberate upgrade, not a weekly bump. (Whenever EF Core moves, even by a patch,
      # dotnet-ef in MedApp.API/Dockerfile, DOTNET_EF_VERSION, should follow; Dependabot doesn't update that.)
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      # PDFsharp and MigraDoc (letters' PDFs) are MIT up to 6.2.x, and AGPL-3.0 from 6.5.0: a licence MedApp can't
      # take without a decision. Only 6.2.x patches are proposed (MedApp.Infrastructure/Letters/Fonts/NOTICE.txt).
      - dependency-name: "PDFsharp*"
        versions: [">= 6.3.0"]

  # MedApp.Web, and the UI parity screenshot tool.
  - package-ecosystem: npm
    directories:
      - /MedApp.Web
      - /tools/ui-parity
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # Node's types follow the Node that runs the code. CI's web job uses Node 24 (main.yml), and the image's page
      # server runs Node 22 (MedApp.API/Dockerfile, NODE_VERSION), so types for Node 25 or later would accept APIs
      # neither has. Move this with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Lexical moves with @astryxdesign/richtext, whose peer range pins its minor (^0.52.0 allows only 0.52.x), and
      # a 0.x minor is a breaking release. Upgrade it with Astryx, in Astryx's own PR (MedApp.Web/AGENTS.md).
      - dependency-name: "lexical"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@lexical/*"
        update-types: [version-update:semver-minor, version-update:semver-major]

  # The base images in the API's Dockerfile. Its FROM lines take their tags from ARGs (NODE_VERSION, DOTNET_VERSION),
  # which Dependabot can't follow, so until they're written out (ideally with digests) this finds nothing to update.
  - package-ecosystem: docker
    directory: /MedApp.API
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]
