clinic: Dermatology
templates:

  - template: Suspected skin cancer
    retentionClass: Oncology
    summary: "Urgent suspected skin cancer referral: dermoscopy, biopsy where the centre can take one, histology and the skin cancer MDT, ending in care completed or hospital treatment."
    start: triage
    stages:
      - id: triage
        name: Triage
        owner: clinic
        kind: step
        visit: none
        next: [dermoscopy]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 225390008 | Triage
        notes: "Urgent suspected cancer referral: record the referral date, lesion site, history and risk factors. Book within the urgent target."

      - id: dermoscopy
        name: Dermoscopy assessment
        owner: clinic
        kind: assessment
        visit: required
        next: null
        outcomes:
          - name: Looks benign
            next: [care-plan]
          - name: Actinic keratosis
            next: [refer-gp]
          - name: Suspected BCC
            next: [refer-hospital]
          - name: Suspected SCC
            next: [refer-hospital-urgent]
          - name: Suspected melanoma
            next: [refer-hospital-urgent]
          - name: "Uncertain: biopsy"
            next: [take-biopsy]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: Full skin check, dermoscopy and clinical photographs; record lesion size and site.

      - id: take-biopsy
        name: Take biopsy
        owner: clinic
        kind: step
        visit: required
        next: [histology]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: true
        repeat: null
        mdt: false
        consult: null
        snomed: 240977001 | Biopsy of skin
        notes: "Punch, shave or incisional biopsy. Never a partial biopsy of a possible melanoma: that is excised whole at the hospital."

      - id: histology
        name: Histology
        owner: lab
        kind: step
        visit: none
        next: [histology-result]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 252416005 | Histopathology test
        notes: The lab processes the specimen and enters the histology report.

      - id: histology-result
        name: Histology result
        owner: clinic
        kind: labResult
        visit: suggested
        next: null
        outcomes:
          - name: Benign
            next: [care-plan]
          - name: Actinic keratosis
            next: [refer-gp]
          - name: Bowen's disease
            next: [refer-hospital]
          - name: Low-risk BCC
            next: [refer-hospital]
          - name: High-risk BCC
            next: [mdt]
          - name: Squamous cell carcinoma
            next: [mdt]
          - name: Melanoma
            next: [mdt]
          - name: Not diagnostic
            next: [take-biopsy]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: The clinician records the histology diagnosis. BCC risk is the clinician's judgement from the report, recorded as given.

      - id: mdt
        name: Skin cancer MDT
        owner: clinic
        kind: assessment
        visit: none
        next: null
        outcomes:
          - name: Hospital treatment
            next: [refer-hospital-urgent]
          - name: More tissue needed
            next: [take-biopsy]
          - name: Benign on review
            next: [care-plan]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: true
        consult: null
        snomed: null
        notes: Local skin cancer MDT (dermatology and pathology). Record the team's decision.

      - id: care-plan
        name: Agree care plan
        owner: clinic
        kind: step
        visit: suggested
        next: [discharge]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: Self-examination and sun protection advice, with written information.

      - id: discharge
        name: Final letter to GP
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: discharge
        optional: false
        needsLetter: Final letter to GP
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 58000006 | Patient discharge
        notes: Histology, the care plan and self-examination advice in the letter.

      - id: refer-gp
        name: Refer to GP
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: gpReferral
        optional: false
        needsLetter: Referral letter to GP
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 306206005 | Referral to service
        notes: "Actinic keratosis: topical treatment needs prescribing. Sun protection advice given; cryotherapy is not offered here."

      - id: refer-hospital
        name: Refer to hospital
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: hospitalReferral
        optional: false
        needsLetter: Referral letter to hospital
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 306206005 | Referral to service
        notes: "Routine referral for treatment: low-risk BCC or Bowen's disease (surgery, cryotherapy or photodynamic therapy)."

      - id: refer-hospital-urgent
        name: Urgent hospital referral
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: hospitalReferral
        optional: false
        needsLetter: Urgent referral letter to hospital
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 306206005 | Referral to service
        notes: "Urgent suspected cancer referral: excision biopsy of a suspected melanoma or SCC, or treatment as the MDT agreed."

    addableRoutes:
      - name: Biopsy another lesion
        attachesAfter: dermoscopy
        reason: A second lesion found at the skin check also needs a biopsy.
        stages:
          - id: biopsy-another
            name: Take biopsy
            owner: clinic
            kind: step
            visit: required
            next: [histology]
            outcomes: null
            endOutcome: null
            optional: false
            needsLetter: null
            needsConsent: true
            repeat: null
            mdt: false
            consult: null
            snomed: 240977001 | Biopsy of skin
            notes: Record the second lesion's site; it goes to the lab as its own specimen.

  - template: Changing mole or lesion check
    retentionClass: Standard
    summary: "Routine check of a changing or uncertain mole: dermoscopy, then reassurance, photo monitoring with recall, or urgent referral for excision."
    start: triage
    stages:
      - id: triage
        name: Triage
        owner: clinic
        kind: step
        visit: none
        next: [dermoscopy]
        outcomes: null
