{{- if .Values.ingress.enabled }}
{{- $tls := .Values.ingress.tls }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medapp.fullname" . }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if and $tls.enabled $tls.clusterIssuer }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" $tls.clusterIssuer }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - secretName: {{ $tls.secretName | default (printf "%s-tls" (include "medapp.fullname" .)) }}
      hosts:
        - {{ required "ingress.host is required with ingress.tls.enabled" .Values.ingress.host }}
  {{- end }}
  rules:
    # Everything goes to the API: /api, the notifications hub's WebSocket, and the app's pages.
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "medapp.fullname" . }}-api
                port:
                  name: http
{{- end }}
