clinic: Eye clinic
status: draft, not yet reviewed by a clinician (the owner reviews it as dermatology.yaml was)
templates:

  - template: Cataract assessment
    retentionClass: Standard
    summary: "Cataract referral from an optometrist: assessment and, when surgery is wanted and suitable, biometry before referral to the hospital for the operation."
    start: triage
    stages:
      - id: triage
        name: Triage
        owner: clinic
        kind: step
        visit: none
        next: [assessment]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 225390008 | Triage
        notes: "Referral from the optometrist: record the visual acuity given and the reason for referral."

      - id: assessment
        name: Cataract assessment
        owner: clinic
        kind: assessment
        visit: required
        next: null
        outcomes:
          - name: Wants surgery and suitable
            next: [biometry]
          - name: Not affecting daily life
            next: [discharge]
          - name: Other eye problem found
            next: [refer-hospital]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: Slit lamp and dilated examination; talk through the benefits and risks of surgery. The patient decides whether they want it.

      - id: biometry
        name: Biometry
        owner: clinic
        kind: step
        visit: required
        next: [refer-surgery]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: Measurements for the lens implant, taken as the hospital asks, recorded as measured.

      - id: refer-surgery
        name: Refer for cataract surgery
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: hospitalReferral
        optional: false
        needsLetter: Referral letter to hospital
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 306206005 | Referral to service
        notes: Referral for the operation, with the biometry and which eye.

      - id: discharge
        name: Final letter to GP
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: discharge
        optional: false
        needsLetter: Final letter to GP
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 58000006 | Patient discharge
        notes: "Cataract not affecting daily life: advice to return through the optometrist if vision changes."

      - id: refer-hospital
        name: Refer to hospital eye service
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: hospitalReferral
        optional: false
        needsLetter: Referral letter to hospital
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 306206005 | Referral to service
        notes: Another eye problem found at the assessment, for the hospital eye service.

