      - id: discharge
        name: Final letter to GP
        owner: clinic
        kind: step
        visit: none
        next: []
        outcomes: null
        endOutcome: discharge
        optional: false
        needsLetter: Final letter to GP
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 58000006 | Patient discharge
        notes: Diagnosis, care plan and self-care advice in the letter.

      - id: refer-hospital-urgent
