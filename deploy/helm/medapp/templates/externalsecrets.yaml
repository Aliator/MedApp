{{- /*
With externalSecrets.enabled, External Secrets Operator fills the database, first admin and backplane Secrets from a secret
store (Azure Key Vault, and others), in place of the chart's own (secret.yaml), and the mail server's with
email.smtp.auth.enabled. An existingSecret still wins.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}
{{- fail "externalSecrets.secretStoreRef.name is required: the SecretStore or ClusterSecretStore to read from." }}
{{- end }}
{{- $secrets := list }}
{{- if not .Values.database.existingSecret }}
{{- $secrets = append $secrets (dict "name" (include "medapp.dbSecretName" .) "keys" .Values.externalSecrets.database) }}
{{- end }}
{{- if and .Values.firstAdmin.enabled (not .Values.firstAdmin.existingSecret) }}
{{- $secrets = append $secrets (dict "name" (include "medapp.firstAdminSecretName" .) "keys" .Values.externalSecrets.firstAdmin) }}
{{- end }}
{{- if and .Values.backplane.enabled (not .Values.backplane.existingSecret) }}
{{- $secrets = append $secrets (dict "name" (include "medapp.backplaneSecretName" .) "keys" .Values.externalSecrets.backplane) }}
{{- end }}
{{- if and .Values.email.smtp.auth.enabled (not .Values.email.smtp.auth.existingSecret) }}
{{- $keys := deepCopy .Values.externalSecrets.email }}
{{- if .Values.email.smtp.username }}
{{- /* The user name is set in the values, so only the password comes from the store. */}}
{{- $_ := unset $keys "username" }}
{{- end }}
{{- $secrets = append $secrets (dict "name" (include "medapp.emailSecretName" .) "keys" $keys) }}
{{- end }}
{{- range $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "medapp.labels" $ | nindent 4 }}
  annotations:
    # Under Argo CD: before everything that reads these Secrets.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml $.Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := .keys }}
    {{- if $ref }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ required (printf "externalSecrets: %s needs a key" $secretKey) $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
