        notes: "Routine referral: record the reported change, its duration and history."

      - id: dermoscopy
        name: Dermoscopy assessment
        owner: clinic
        kind: assessment
        visit: required
        next: null
        outcomes:
          - name: Looks benign
            next: [care-plan]
          - name: "Uncertain: monitor"
            next: [take-photos]
          - name: Suspected skin cancer
            next: [refer-hospital-urgent]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: Dermoscopy of the mole and a skin check; record size and site.

      - id: take-photos
        name: Take photographs
        owner: clinic
        kind: step
        visit: required
        next: [mole-review]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: true
        repeat: null
        mdt: false
        consult: null
        snomed: null
        notes: Baseline clinical and dermoscopy photographs, for comparison at review.

      - id: mole-review
        name: Mole review
        owner: clinic
        kind: assessment
        visit: required
        next: null
        outcomes:
          - name: No change
            next: [care-plan]
          - name: Keep monitoring
            next: [mole-review]
          - name: Mole has changed
            next: [refer-hospital-urgent]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: Every 3 months (short-term) or 6 to 12 months (several atypical moles); stops when care is completed or at referral.
        mdt: false
        consult: null
        snomed: null
        notes: Compare with the earlier photographs; record what changed, if anything.

      - id: care-plan
        name: Agree care plan
        owner: clinic
        kind: step
        visit: suggested
        next: [discharge]
        outcomes: null
