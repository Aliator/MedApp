# Local stand-ins for what a real cluster gets from its cloud, applied by up.sh once cert-manager and External
# Secrets Operator are installed.

# TLS: cert-manager issues the ingress's certificate itself (self-signed), where a real cluster would use an issuer
# a browser trusts, such as Let's Encrypt.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: medapp-local
spec:
  selfSigned: {}
---
# The secret store: plain Secrets in the medapp-vault namespace, read through External Secrets Operator's Kubernetes
# provider, where Azure will use Key Vault. MedApp's chart only ever sees the ClusterSecretStore.
apiVersion: v1
kind: Namespace
metadata:
  name: medapp-vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: medapp-vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-reader
  namespace: medapp-vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-reader
  namespace: medapp-vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-reader
subjects:
  - kind: ServiceAccount
    name: vault-reader
    namespace: medapp-vault
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: medapp-local-vault
spec:
  # Only ExternalSecrets in the medapp namespace may use it, as on Azure (deploy/azure/cluster.yaml).
  conditions:
    - namespaces: [medapp]
  provider:
    kubernetes:
      remoteNamespace: medapp-vault
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: medapp-vault
      auth:
        serviceAccount:
          name: vault-reader
          namespace: medapp-vault
