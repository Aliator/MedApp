{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medapp.fullname" . }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ required "ingress.tls.secretName is required with ingress.tls.enabled" .Values.ingress.tls.secretName }}
      hosts:
        - {{ required "ingress.host is required with ingress.tls.enabled" .Values.ingress.host }}
  {{- end }}
  rules:
    # Everything goes to the API: /api, the notifications hub's WebSocket, and the app's pages.
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "medapp.fullname" . }}-api
                port:
                  name: http
{{- end }}
