{{- /*
The chart's own Secrets, for when they come from neither an existing Secret nor a secret store (externalSecrets):
random values, kept across upgrades (lookup) and on uninstall. lookup can't see the cluster under helm template or
Argo CD, so there use database.existingSecret and firstAdmin.existingSecret, or externalSecrets.
*/}}
{{- if not .Values.externalSecrets.enabled }}
{{- if not .Values.database.existingSecret }}
{{- if not .Values.sql.enabled }}
{{- fail "An external database (sql.enabled false) needs its connection string from database.existingSecret or externalSecrets." }}
{{- end }}
{{- $name := include "medapp.dbSecretName" . }}
{{- /* Keep the password across upgrades: SQL Server's data volume only opens with the one it was created with. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing (index $existing.data "sa-password") }}
{{- $password = index $existing.data "sa-password" | b64dec }}
{{- else }}
{{- /* Letters and digits only, so it needs no escaping in the connection string; A, a and 1 meet SQL Server's rules. */}}
{{- $password = printf "Aa1%s" (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall, like SQL Server's volume, so a reinstall can still open the data.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  sa-password: {{ $password | b64enc | quote }}
  connection-string: {{ printf "Server=%s,1433;Database=MedApp;User ID=sa;Password=%s;TrustServerCertificate=True" (include "medapp.sqlName" .) $password | b64enc | quote }}
{{- end }}
{{- if and .Values.firstAdmin.enabled (not .Values.firstAdmin.existingSecret) }}
{{- $name := include "medapp.firstAdminSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- /* Long and random; the A, a and 1 meet the app's password rules (Identity in appsettings.json). */}}
{{- $password = printf "Aa1%s" (randAlphaNum 24) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall, like the database the admin lives in.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  username: {{ "admin" | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- if and .Values.backplane.enabled (not .Values.backplane.existingSecret) }}
{{- if not .Values.backplane.valkey.enabled }}
{{- fail "Another backplane server (backplane.valkey.enabled false) needs its connection string from backplane.existingSecret or externalSecrets." }}
{{- end }}
{{- $name := include "medapp.backplaneSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  connection-string: {{ printf "%s:6379,password=%s" (include "medapp.valkeyName" .) $password | b64enc | quote }}
{{- end }}
{{- end }}
