name: PR Unit Tests & Coverage
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: write
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Run unit tests with coverage
        run: |
          dotnet test MedApp.UnitTests \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutput=../coverage/ \
            /p:CoverletOutputFormat=cobertura \
            /p:Exclude="[MedApp.API]*%2c[*]*.Program%2c[*]*.Startup"
      
      - name: Debug - Find coverage files
        run: |
          echo "=== Looking for coverage files ==="
          find . -name "*.cobertura.xml" -o -name "coverage.cobertura.xml"
          echo "=== Contents of MedApp.UnitTests ==="
          ls -la MedApp.UnitTests/
          echo "=== Root coverage folder (if exists) ==="
          ls -la coverage/ || echo "No coverage folder in root"
      
      - name: Coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/coverage.cobertura.xml
          format: markdown
          output: both
      
      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
