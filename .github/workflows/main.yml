name: PR Unit Tests & Coverage
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: write
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Run unit tests with coverage
        run: |
          dotnet test MedApp.UnitTests \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
      
      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'Html;MarkdownSummaryGithub;Cobertura'
          assemblyfilters: '+MedApp.*;-MedApp.Contracts;-MedApp.API'
          filefilters: '-**/Migrations/*.cs;-**/Program.cs;-**/Startup.cs'
          classfilters: '-*Query;-*Command;-*ServiceExtensions;-*Configuration;-*Settings;-MedApp.Infrastructure.Data.MedAppDbContext;-MedApp.Infrastructure.Data.Repositories.PatientRepository'
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
      
      - name: Create detailed coverage comment
        run: |
          echo "## 📊 Coverage Report" > coverage-details.md
          echo "" >> coverage-details.md
          cat coverage-report/SummaryGithub.md >> coverage-details.md
          echo "" >> coverage-details.md
          echo "### 📉 Classes Below 80% Coverage" >> coverage-details.md
          echo "" >> coverage-details.md
          echo "| Class | Line Coverage | Branch Coverage |" >> coverage-details.md
          echo "|-------|---------------|-----------------|" >> coverage-details.md

          python3 << 'EOF'
          import xml.etree.ElementTree as ET

          EXCLUDED_PATTERNS = [
              ".Domain.",
              ".Repositories.",
              "Repository",
          ]

          def is_excluded(name):
              return any(p in name for p in EXCLUDED_PATTERNS)

          tree = ET.parse('coverage-report/Cobertura.xml')
          root = tree.getroot()

          rows = []

          for package in root.findall('.//package'):
              for cls in package.findall('.//class'):
                  class_name = cls.get('name')
                  if not class_name or is_excluded(class_name):
                      continue

                  line_rate = float(cls.get('line-rate', 0)) * 100
                  branch_rate = float(cls.get('branch-rate', 0)) * 100 if cls.get('branch-rate') else 100

                  if line_rate < 80:
                      rows.append((class_name, line_rate, branch_rate))

          rows.sort(key=lambda x: x[1])

          with open('coverage-details.md', 'a') as f:
              if rows:
                  for name, line, branch in rows:
                      f.write(f"| `{name}` | {line:.1f}% | {branch:.1f}% |\n")
              else:
                  f.write("| *All classes above 80% coverage!* 🎉 | - | - |\n")
          EOF

      
      - name: Comment PR with coverage summary
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: coverage-details.md
