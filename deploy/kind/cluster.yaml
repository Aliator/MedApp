# A one-node local cluster for MedApp (kind: Kubernetes in Docker). Created by up.sh.
# Traefik's node ports are mapped to this machine only (127.0.0.1):
#   http://localhost:8080   -> the app, through the ingress (Traefik's http entry point, node port 30080)
#   https://localhost:8443  -> the same, with a self-signed certificate from cert-manager (node port 30443)
# kind can't change a cluster's ports after it's made: after editing these, run down.sh, then up.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: medapp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
