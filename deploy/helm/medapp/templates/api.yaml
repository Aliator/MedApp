{{- $name := printf "%s-api" (include "medapp.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "medapp.selectorLabels" (list . "api") | nindent 4 }}
  # Only the app's port: the health port (8081) is for the kubelet's probes, never the Service or the ingress.
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # Under Argo CD: after the migrations (wave 1), so a new API never runs on an old schema.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "medapp.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medapp.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own non-root user (APP_UID in the .NET images).
      {{- include "medapp.podSecurity" (list . 1654) | nindent 6 }}
      {{- if gt (int .Values.api.replicas) 1 }}
      # The copies on different nodes where there are enough, so losing one node doesn't take them all. A preference,
      # not a rule (ScheduleAnyway): a one-node cluster, such as kind, still runs every copy.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "medapp.selectorLabels" (list . "api") | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "medapp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "medapp.containerSecurityContext" . | nindent 12 }}
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.dbSecretName" . }}
                  key: connection-string
            {{- if .Values.backplane.enabled }}
            # Live notifications through the backplane, so every copy of the API reaches every browser.
            - name: ConnectionStrings__SignalRBackplane
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.backplaneSecretName" . }}
                  key: connection-string
            {{- end }}
            # The app on 8080, and /health and /alive on 8081 only (MedApp.ServiceDefaults).
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080;8081"
            - name: HealthChecks__Port
              value: "8081"
            # Behind the ingress: take the client's scheme and address from its X-Forwarded-* headers.
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            {{- with .Values.api.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          lifecycle:
            # Keep serving for a moment after being told to stop, while the ingress stops sending requests here.
            # Without it, a rollout fails the odd request sent to the old pod as it shuts down.
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; .NET and Node get a scratch folder.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- if gt (int .Values.api.replicas) 1 }}
{{- if not .Values.backplane.enabled }}
{{- fail "api.replicas above 1 needs backplane.enabled: without it, live notifications reach only the browsers on the copy that sends them." }}
{{- end }}
---
# Keeps at least one copy of the API running while nodes are drained (upgrades, scaling down).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "medapp.selectorLabels" (list . "api") | nindent 6 }}
{{- end }}
