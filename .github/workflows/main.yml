name: CI
# What runs, and when (AGENTS.md, CI):
#   - A pull request to main runs a tier, chosen by the `changes` job from the pull request's labels and what it changed:
#     none (only docs changed, or the `ci:none` label), light (the default: quick checks of the side that changed) or
#     full (the `ci:full` label: everything). Adding or removing a label starts a run, so a label takes effect at once.
#   - Every push to main, and a nightly run, get the full suite. It gates nothing (Publish deploys alongside it): it's
#     how what a light pull request missed is found, and a failure opens or updates one issue (the main-report job).
# The light tiers are a deliberate choice while MedApp isn't live (docs/todo.md, Testing).
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # Nightly, for what changes without a commit: a new advisory, a rebuilt base image, a date a test depends on.
    - cron: '17 3 * * *'
# Each job asks for what it needs beyond reading the repository.
permissions:
  contents: read
concurrency:
  # One run at a time for each pull request, and one for main: a newer push (or label change) cancels the run before it.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # What this run does: the tier, and from it which jobs run (.github/scripts/ci-plan.sh has the rules, in one place,
  # and ci-plan.test.sh their cases). A job that isn't needed is skipped by its `if`, and GitHub counts a job skipped
  # that way as passing a required check.
  #   - The tier comes from the whole pull request's changes against its base (not from the last push: a pull request
  #     whose first push changed .NET and whose second changed the web app still needs both sides checked), and from
  #     its labels.
  #   - Then, as before the tiers: an event that changes nothing those jobs test needs no run of them. That's a push of
  #     only docs/, or a label change, on top of a run of the same commit (the one before, for a push) that passed, ran
  #     every job this one would, and has had nothing merged into the base branch since it started. A run tests the
  #     pull request merged into its base, so this one would test exactly what that one did.
  #   - Anything unsure runs more, not less: a comparison that fails or lists 300 files or more (it lists only that
  #     many) is the full tier, and if this job fails, every job runs, in full (each job's `if` skips only on a value
  #     this job set).
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read    # the previous runs of this workflow, and their jobs
      contents: read   # check out the scripts, compare commits, and list the base branch's commits since a passing run
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      web: ${{ steps.plan.outputs.web }}
      web_build: ${{ steps.plan.outputs.web_build }}
      web_files: ${{ steps.plan.outputs.web_files }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      integration: ${{ steps.plan.outputs.integration }}
      image: ${{ steps.plan.outputs.image }}
      e2e: ${{ steps.plan.outputs.e2e }}
      helm: ${{ steps.plan.outputs.helm }}
      coverage: ${{ steps.plan.outputs.coverage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - name: Test the tier chooser
        run: bash .github/scripts/ci-plan.test.sh

      - name: Choose the tier and the jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # The whole pull request's files: its head against where it left the base branch (a three-dot comparison),
          # each by its name and, if it moved, its old name. "unknown" if the comparison fails.
          labels=''; files=''; known=true
          if [ "$EVENT" = pull_request ]; then
            labels=$(jq -r 'if type == "array" then join(" ") else "" end' <<< "$LABELS_JSON") || labels=''
            listed=$(gh api "repos/$REPO/compare/$BASE...$AFTER" \
              --jq 'if .files == null then "unknown" else (.files | length), (.files[] | .filename, (.previous_filename // empty)) end') \
              || listed=unknown
            count=$(head -n 1 <<< "$listed")
            files=$(tail -n +2 <<< "$listed")
            if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -ge 300 ]; then known=false; fi
          fi
          plan=$(EVENT="$EVENT" LABELS="$labels" KNOWN="$known" bash .github/scripts/ci-plan.sh <<< "$files")
          get() { sed -n "s/^$1=//p" <<< "$plan"; }
          tier=$(get tier); reason=$(get reason)
          web=$(get web); web_build=$(get web_build); dotnet=$(get dotnet); integration=$(get integration)
          image=$(get image); e2e=$(get e2e); helm=$(get helm); coverage=$(get coverage)

          # Does this event change anything those jobs test? Not if it's a push of only docs/, or a label change, after
          # a run that already passed with them all.
          previous=''; why=''
          if [ "$EVENT" = pull_request ] && [ "$tier" != none ]; then
            case "$ACTION" in
              synchronize)
                # "ahead": the new commit has the previous one in its history. Then how many files changed, and how
                # many of their names (old and new) are outside docs/.
                compared=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
                  --jq '(.files // []) as $f | "\(.status) \($f | length) \([$f[] | .filename, (.previous_filename // empty) | select(startswith("docs/") | not)] | length)"') \
                  || compared='unknown'
                read -r status changed outside <<< "$compared" || true
                if [ "$status" = ahead ] && [ "${changed:-300}" -lt 300 ] && [ "$outside" = 0 ]; then previous=$BEFORE; fi
                why="this push compared with $BEFORE: $compared" ;;
              labeled | unlabeled)
                previous=$AFTER
                why="a label change" ;;
            esac
          fi
          if [ -n "$previous" ]; then
            # The latest other run of that commit: it must have passed...
            latest=$(gh api "repos/$REPO/actions/workflows/main.yml/runs?head_sha=$previous&event=pull_request&per_page=5" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0] | \"\(.id) \(.conclusion) \(.run_started_at)\"") || latest=''
            read -r run conclusion started <<< "$latest" || true
            covered=false; moved=unknown
            if [ "$conclusion" = success ]; then
              # ...with every job this run would run (one job stands for each kind; the web jobs differ by tier)...
              ran=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name') || ran=''
              covered=true
              need() { grep -qxF "$1" <<< "$ran" || covered=false; }
              [ "$web" != light ] || need web-checks
              [ "$web" != full ] || need web-coverage
              [ "$dotnet" != true ] || need unit-tests
              [ "$integration" != true ] || need 'integration-tests (shard 1)'
              [ "$image" != true ] || need image
              [ "$e2e" != true ] || need e2e
              [ "$helm" != true ] || need helm
              # ...and nothing merged into the base since it started (a run tests the pull request merged into its
              # base as it was).
              moved=$(gh api "repos/$REPO/commits?sha=$BASE&since=$started&per_page=1" --jq 'length') || moved=unknown
            fi
            if [ "$covered" = true ] && [ "$moved" = 0 ]; then
              reason="nothing to test again ($why): run $run of $previous passed with every job the $tier tier would run ($reason), and nothing has merged into $BASE since it started"
              tier=none; web=none; web_build=false; dotnet=false; integration=false; image=false; e2e=false; helm=false; coverage=false
            else
              reason="$reason. Not skipped ($why): the run before, of $previous, was ${run:-none} (${conclusion:-none}); it ran every job needed: $covered; commits on $BASE since: $moved"
            fi
          fi

          # The web app's changed files, for the light tier's tests.
          web_files=''
          [ "$web" != light ] || web_files=$(grep '^MedApp\.Web/' <<< "$files" || true)
          delimiter="files_$(openssl rand -hex 16)"
          {
            printf '%s\n' "tier=$tier" "web=$web" "web_build=$web_build" "dotnet=$dotnet" "integration=$integration" \
              "image=$image" "e2e=$e2e" "helm=$helm" "coverage=$coverage"
            printf '%s\n' "web_files<<$delimiter" "$web_files" "$delimiter"
          } >> "$GITHUB_OUTPUT"

          # What that means, for the run's summary and its log.
          say() { if [ "$2" = true ]; then echo "- **$1:** runs"; else echo "- **$1:** skipped"; fi; }
          {
            echo "### CI tier: $tier"
            echo
            echo "$reason."
            echo
            case "$web" in
              none) echo "- **web:** skipped" ;;
              light) echo "- **web:** lint, type check and the changed files' own tests$([ "$web_build" = true ] && echo ', and the production build'); no coverage" ;;
              *) echo "- **web:** everything (audit, lint, type check, every test with the coverage thresholds, the production build)" ;;
            esac
            say unit-tests "$dotnet"
            say integration-tests "$integration"
            say image "$image"
            say e2e "$e2e"
            say helm "$helm"
            say 'coverage comment' "$coverage"
            if [ "$tier" != full ] && [ "$EVENT" = pull_request ]; then
              echo
              echo "What a pull request skips runs on main after it merges. For everything on this pull request, add the \`ci:full\` label."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # MedApp.Web (React), in parallel jobs: web-checks (the audit, lint, type check, theme drift and the production
  # build), web-tests (Vitest, in shards) and, in the full tier, web-coverage (the shards' coverage as one report, held
  # to the thresholds). The `web` job after them is the required check: it passes only if each did what the tier asks.
  #   - Light: web-checks alone. Lint, the type check, theme drift and the changed files' own tests; the build only if
  #     the pull request changed something the build reads beyond the source (`web_build`). No audit and no coverage.
  #   - Full (and whenever `changes` gave no answer): everything.
  web-checks:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: MedApp.Web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MedApp.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A known high or critical advisory in any installed package fails the pull request. Dev dependencies too: they
      # run here, in CI, and in the image's build stage. Moderate and low ones are left to Dependabot.
      # An advisory with no fixed version yet can be accepted for a short, dated time (AGENTS.md, Supply chain rules),
      # by its GitHub advisory ID in ACCEPTED, with a docs/todo.md entry it expires with. Only those IDs are let through;
      # any other high or critical advisory still fails, and after ACCEPTED_UNTIL the audit counts them all again.
      #   GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high; failing the audit from 17 November 2026): every picomatch up to
      #   4.0.7, the latest, is affected. Accepted to the end of 17 December 2026. It reaches only build and test tools (Vite, Vitest, the router plugin,
      #   typescript-eslint, the Astryx CLI), never the app: `npm audit --omit=dev` is clean.
      - name: Audit dependencies
        if: ${{ needs.changes.outputs.web != 'light' }}
        env:
          ACCEPTED: GHSA-fc5q-39xc-vjpf
          ACCEPTED_UNTIL: '2026-12-17'
        run: |
          # The whole report, for the log.
          npm audit --audit-level=high || true
          # The end date must be a date, at most 31 days ahead, so a typo can't keep an exception open.
          if [[ -n "$ACCEPTED" ]] && { ! [[ "$ACCEPTED_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ "$ACCEPTED_UNTIL" > "$(date -u -d '+31 days' +%F)" ]]; }; then
            echo "::error::ACCEPTED_UNTIL must be a date (YYYY-MM-DD) at most 31 days ahead, not '$ACCEPTED_UNTIL'."
            exit 1
          fi
          if [[ -z "$ACCEPTED" || "$(date -u +%F)" > "$ACCEPTED_UNTIL" ]]; then
            [[ -n "$ACCEPTED" ]] && echo "::warning::$ACCEPTED was accepted until $ACCEPTED_UNTIL: the audit counts it again."
            npm audit --audit-level=high
            exit
          fi
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            if (!report.vulnerabilities) {
              console.error("npm audit gave no report:", JSON.stringify(report).slice(0, 500));
              process.exit(1);
            }
            // Advisories are the objects in each package`s "via" (the strings there name packages that bring one in).
            const found = new Set();
            for (const pkg of Object.values(report.vulnerabilities))
              for (const via of pkg.via)
                if (typeof via === "object" && ["high", "critical"].includes(via.severity))
                  found.add(String(via.url ?? via.source).split("/").pop());
            const accepted = process.env.ACCEPTED.split(/\s+/);
            const others = [...found].filter((id) => !accepted.includes(id));
            if (others.length > 0) {
              console.error("High or critical advisories:", others.join(", "));
              process.exit(1);
            }
            console.log(`No high or critical advisories but ${[...found].join(", ") || "none"}, accepted until ${process.env.ACCEPTED_UNTIL}.`);
          '

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check the built theme is up to date
        run: npm run theme:check

      # Light tier only: the tests of the files the pull request changed. That's each changed test file, and the test
      # beside each changed source file (Page.tsx has Page.test.tsx). Not the tests that import them: the route tree
      # imports every page, so `vitest related` ran three quarters of the suite for one page. What a change breaks
      # elsewhere is found by main's run. The names come from the pull request, so they're only ever passed as
      # arguments, by their full paths (never read by the shell, and never mistaken for an option).
      - name: Unit tests of the changed files
        if: ${{ needs.changes.outputs.web == 'light' }}
        env:
          WEB_FILES: ${{ needs.changes.outputs.web_files }}
        run: |
          tests=()
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            path="$GITHUB_WORKSPACE/$file"
            case "$file" in
              *.test.*) candidates=("$path") ;;
              *.*) candidates=("${path%.*}.test.tsx" "${path%.*}.test.ts") ;;
              *) candidates=() ;;
            esac
            for test in "${candidates[@]}"; do
              # A deleted file has nothing to run.
              if [ -f "$test" ] && [[ " ${tests[*]} " != *" $test "* ]]; then tests+=("$test"); fi
            done
          done <<< "$WEB_FILES"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "None of the changed files has a test of its own."
            exit 0
          fi
          printf 'Running %s\n' "${tests[@]#"$GITHUB_WORKSPACE/MedApp.Web/"}"
          npx vitest run "${tests[@]}"

      # The whole production build, as the image's Dockerfile runs it: tsc, the client build, the server rendering
      # bundle (vite build --ssr) and the copy of the page server.
      - name: Build
        if: ${{ needs.changes.outputs.web != 'light' || needs.changes.outputs.web_build == 'true' }}
        run: npm run build

  # Every Vitest test, with coverage, split across runners by file (--shard): full tier only. Each shard's number and
  # the count come from the matrix, so changing the list is all it takes to change the count. A shard covers only its
  # share, so the thresholds can't apply to it: they're set to 0 on the command line here only, and web-coverage
  # applies vite.config.ts's to the merged report. Each shard saves its results and coverage as a blob for that.
  web-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'none' && needs.changes.outputs.web != 'light' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every shard reports, so one failure doesn't hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: MedApp.Web
    env:
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MedApp.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: >-
          npx vitest run --shard="$SHARD" --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
          --reporter=default --reporter=blob --outputFile.blob="blob-reports/blob-${{ matrix.shard }}.json"

      - name: Upload the shard's results and coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-blob-${{ matrix.shard }}
          path: MedApp.Web/blob-reports
          if-no-files-found: error
          retention-days: 1

  # The shards' coverage, merged into one report and held to the thresholds in vite.config.ts, as one run of the whole
  # suite would be. Its summary goes into the sticky PR comment, after the .NET coverage (coverage-comment job).
  web-coverage:
    needs: [changes, web-tests]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'none' && needs.changes.outputs.web != 'light' && needs.web-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: MedApp.Web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MedApp.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: web-blob-*
          path: MedApp.Web/blob-reports
          merge-multiple: true

      # Runs no test: it reads the shards' blobs, reports them as one run and checks the coverage thresholds.
      - name: Merge the shards' coverage and check the thresholds
        run: npx vitest run --merge-reports=blob-reports --coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: MedApp.Web/coverage/coverage-summary.json

  # The required check for the web app. The jobs above report under their own names (and the shards as
  # "web-tests (1)"), so this one keeps the name main's ruleset requires, and says whether each did what the tier asks:
  # passed, or skipped because `changes` said so. A failed, cancelled or wrongly skipped job fails it. When the tier
  # has no web job at all, this one is skipped too (which passes the check), rather than wait for a runner to say so.
  web:
    needs: [changes, web-checks, web-tests, web-coverage]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'none' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the web jobs did what the tier asks
        env:
          TIER: ${{ needs.changes.outputs.web }}
          GOT: ${{ needs.web-checks.result }} ${{ needs.web-tests.result }} ${{ needs.web-coverage.result }}
        run: |
          case "$TIER" in
            light) want='success skipped skipped' ;;
            *) want='success success success' ;;
          esac
          echo "web-checks, web-tests and web-coverage: $GOT (the '${TIER:-full}' web tier needs: $want)"
          [ "$GOT" = "$want" ]

  # The API's image (MedApp.API/Dockerfile), built as Publish builds it but not pushed, so a broken Dockerfile, a
  # React or SSR bundle that won't build, or a migrations bundle that won't, fails on the pull request rather than
  # after the merge. It shares the GitHub Actions cache with Publish: pull requests start from the layers Publish
  # left on main, and each push to a pull request reuses that pull request's own.
  # The built image is then scanned with Trivy: what it finds goes to code scanning, and a critical vulnerability that
  # has a fix fails the pull request.
  image:
    needs: changes
    # Full tier, or the pull request changed the Dockerfile, .dockerignore or a package manifest or lock. It runs if
    # `changes` gave no answer.
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # check out the code
      security-events: write  # upload Trivy's results to code scanning (a private repository would need actions: read)
    env:
      # Trivy's own image, pinned by digest and run with docker, rather than aquasecurity/trivy-action. In March 2026
      # that action's tags (and setup-trivy's) were force-pushed to a credential stealer, and malicious Trivy images
      # were published under real version tags (GHSA-69fq-xp46-6x23). A digest can't be moved. This is v0.76.2 (an
      # immutable GitHub release, November 2026), with the same digest on Docker Hub, GHCR and ECR Public.
      # Dependabot doesn't update it: bump it by hand, from `docker buildx imagetools inspect aquasec/trivy:<version>`.
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: MedApp.API/Dockerfile
          push: false
          # Into the runner's Docker, for Trivy to scan.
          load: true
          tags: medapp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy reads the image from a tarball, so it never gets the Docker socket (root on the runner).
      - name: Save the image for scanning
        run: docker save medapp-api:ci --output "$RUNNER_TEMP/medapp-api.tar"

      # Every severity, vulnerabilities and secrets, for code scanning. Never fails the job. Unfixed vulnerabilities
      # are left out, as in the gate below: the Debian base images carry many nobody can act on, which would bury the
      # ones we can. Trivy downloads its vulnerability database here, into a cache the gate reuses.
      - name: Scan the image with Trivy (code scanning report)
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP:/scan"
          --volume "$GITHUB_WORKSPACE:/out"
          "$TRIVY_IMAGE"
          image --input /scan/medapp-api.tar --cache-dir /scan/trivy-cache
          --ignore-unfixed --format sarif --output /out/trivy-results.sarif --exit-code 0

      # The gate: a critical vulnerability with a fixed version available fails the pull request.
      - name: Fail on critical vulnerabilities that have a fix
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP:/scan"
          "$TRIVY_IMAGE"
          image --input /scan/medapp-api.tar --cache-dir /scan/trivy-cache
          --scanners vuln --severity CRITICAL --ignore-unfixed --format table --exit-code 1

      # Even when the gate failed, so the findings show in code scanning and on the pull request.
      - name: Upload Trivy's results to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  # The pull request's new and updated dependencies (npm, NuGet, actions), from GitHub's dependency graph: one with a
  # known high or critical advisory fails it, and a comment on the pull request says which. In this workflow rather
  # than one of its own because, like everything else here, it only runs on pull requests to main.
  dependency-review:
    # It compares a pull request with its base: main's own runs have nothing to compare.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read the dependency graph's diff
      pull-requests: write  # the comment (comment-summary-in-pr)
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # The end-to-end tests (MedApp.E2ETests, Playwright) against the production image, run under the chart's restrictions
  # (a read-only root, a writable /tmp only, every Linux capability dropped, no privilege escalation): SQL Server, the
  # image's migrations bundle, its create-first-admin command, then the API (with the React app and its page server) on
  # http://localhost:8080. It runs one copy, without the Valkey backplane kind has. The session cookie stays Secure, as
  # everywhere outside development: browsers keep Secure cookies from http://localhost (a secure context), so nothing
  # is relaxed for CI. SQL Server's password and the first admin's are random for the run and masked in the log, and
  # SQL Server listens on the runner's loopback only.
  e2e:
    needs: changes
    # Full tier only. It runs if `changes` gave no answer.
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # It builds and runs the pull request's own code: it needs no more than to read the repository.
    permissions:
      contents: read
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_USERNAME: e2e-admin
      # Where a failed test's Playwright trace goes (uploaded below). Only this throwaway run keeps traces: they record
      # what was typed, the run's admin password included. e2e.yml, which runs against a deployment, never sets it.
      E2E_TRACE_DIR: ${{ github.workspace }}/e2e-traces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Started first, so it's up by the time the image is built. Upper and lower case, digits and a symbol, as SQL
      # Server's rules need; the password goes to the container through the environment, never on a command line.
      - name: Start SQL Server
        run: |
          password="Sql-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "DB_CONNECTION=Server=127.0.0.1,1433;Database=MedApp;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
          echo "SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          MSSQL_SA_PASSWORD="$password" docker run -d --name sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # As the image job builds it, but kept on the runner (load) rather than thrown away. It reads the cache earlier
      # runs left (the image job, running alongside, writes this run's), so on a cold cache both build from scratch.
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: MedApp.API/Dockerfile
          push: false
          load: true
          tags: medapp-api:e2e
          cache-from: type=gha

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build the tests
        run: dotnet build MedApp.E2ETests --configuration Release

      - name: Install Chromium
        run: pwsh MedApp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Wait for SQL Server
        run: |
          for _ in $(seq 1 60); do
            if SQLCMDPASSWORD="$SQL_PASSWORD" docker exec -e SQLCMDPASSWORD sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' -b > /dev/null 2>&1; then
              echo "SQL Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server didn't start." >&2
          docker logs sql
          exit 1

      # Upper and lower case and digits, as the Identity rules need. Masked in the log.
      - name: Generate the first admin's password
        run: |
          password="E2e-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      # As the chart's migrations Job runs it: read-only, so the bundle unpacks itself into /tmp.
      - name: Migrate the database with the image's bundle
        run: >-
          docker run --rm --network host
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          -e DOTNET_BUNDLE_EXTRACT_BASE_DIR=/tmp
          --entrypoint /app/efbundle medapp-api:e2e --connection "$DB_CONNECTION"

      # The passwords go to the container through the environment (-e with a name only), never on a command line.
      - name: Make the first admin
        env:
          ConnectionStrings__DefaultConnection: ${{ env.DB_CONNECTION }}
          FirstAdmin__Username: ${{ env.E2E_USERNAME }}
          FirstAdmin__Password: ${{ env.E2E_PASSWORD }}
        run: >-
          docker run --rm --network host
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          -e ConnectionStrings__DefaultConnection -e FirstAdmin__Username -e FirstAdmin__Password
          medapp-api:e2e create-first-admin

      - name: Start the API
        env:
          ConnectionStrings__DefaultConnection: ${{ env.DB_CONNECTION }}
        run: |
          docker run -d --name medapp-api --network host \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e ConnectionStrings__DefaultConnection \
            medapp-api:e2e
          for _ in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL/api/auth/whoami" > /dev/null && curl -fsS "$E2E_BASE_URL/login" > /dev/null; then
              echo "The API is up."
              exit 0
            fi
            sleep 2
          done
          echo "The API didn't start." >&2
          docker logs medapp-api
          exit 1

      - name: Run end-to-end tests
        run: dotnet test MedApp.E2ETests --configuration Release --no-build --logger "console;verbosity=normal"

      # Then the image as the Helm chart runs it: the API with Ssr__ServerUrl, and the page server in a container of
      # its own sharing the API's network (as a pod's containers do), as user 1655, read-only, with only the chart's
      # variables (deploy/helm/medapp/templates/api.yaml, the pages container).
      - name: Start the API and the page server as the chart does
        env:
          ConnectionStrings__DefaultConnection: ${{ env.DB_CONNECTION }}
        run: |
          docker rm -f medapp-api
          docker run -d --name medapp-api --network host             --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges             -e ConnectionStrings__DefaultConnection -e Ssr__ServerUrl=http://127.0.0.1:8082             medapp-api:e2e
          docker run -d --name medapp-pages --network container:medapp-api             --user 1655:1655 --read-only --cap-drop ALL --security-opt no-new-privileges             -e HOST=127.0.0.1 -e PORT=8082 -e HEALTH_PORT=8083 -e MEDAPP_API_URL=http://127.0.0.1:8080 -e NODE_ENV=production             --entrypoint node medapp-api:e2e /app/ssr/server.mjs
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8083/alive > /dev/null && curl -fsS "$E2E_BASE_URL/api/auth/whoami" > /dev/null               && curl -fsS "$E2E_BASE_URL/login" | grep -q 'nonce="'; then
              echo "The API and the page server are up, and pages are rendered on the server."
              exit 0
            fi
            sleep 2
          done
          echo "The API and the page server didn't start." >&2
          docker logs medapp-api
          docker logs medapp-pages
          exit 1

      # Each page must be rendered by the page server with its own response's nonce: a fallback to the client-rendered
      # app has none, so it fails.
      - name: Run the server rendering tests against them
        run: >-
          dotnet test MedApp.E2ETests --configuration Release --no-build --logger "console;verbosity=normal"
          --filter "FullyQualifiedName~ContentSecurityPolicyTests"

      - name: Show the API's log
        if: failure()
        run: docker logs medapp-api

      - name: Show the page server's log
        if: failure()
        run: docker logs medapp-pages || true

      - name: Upload the failed tests' Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e-traces
          if-no-files-found: ignore
          retention-days: 7

  # The Helm chart (deploy/helm/medapp): lint it and render it in the configurations it's used in, so a broken
  # template fails here rather than on a deploy. Helm comes with the runner image.
  helm:
    needs: changes
    # Full tier, or the pull request changed deploy/. It runs if `changes` gave no answer.
    if: ${{ !cancelled() && needs.changes.outputs.helm != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint with the chart's own SQL Server
        run: helm lint --strict deploy/helm/medapp --set image.tag=ci

      - name: Lint with the kind cluster's values
        run: helm lint --strict deploy/helm/medapp --values deploy/kind/values.yaml --set image.tag=ci

      - name: Lint with an external database, ingress and TLS
        run: >-
          helm lint --strict deploy/helm/medapp --set image.tag=ci
          --set sql.enabled=false --set database.existingSecret=medapp-db
          --set firstAdmin.existingSecret=medapp-first-admin
          --set ingress.enabled=true --set ingress.host=medapp.example.com
          --set ingress.tls.enabled=true --set ingress.tls.clusterIssuer=letsencrypt

      - name: Lint with an external database from a secret store
        run: >-
          helm lint --strict deploy/helm/medapp --set image.tag=ci
          --set sql.enabled=false --set externalSecrets.enabled=true
          --set externalSecrets.secretStoreRef.name=key-vault --set externalSecrets.database.sa-password=null

      - name: Lint with attachments in a storage account from an existing Secret
        run: >-
          helm lint --strict deploy/helm/medapp --set image.tag=ci
          --set attachments.azurite.enabled=false --set attachments.existingSecret=medapp-attachments

      # Azurite off and no connection string: the API runs without file storage (uploads answer 503).
      - name: Lint without file storage for attachments
        run: helm lint --strict deploy/helm/medapp --set image.tag=ci --set attachments.azurite.enabled=false

      - name: Lint with Azure's values
        run: helm lint --strict deploy/helm/medapp --values deploy/azure/values.yaml --set image.tag=ci

      # As deploy/azure/values.yaml will be once deploy.sh's outputs are filled in: workload identity, the data
      # protection key and the sender address (placeholders).
      - name: Lint with Azure's values, filled in
        run: >-
          helm lint --strict deploy/helm/medapp --values deploy/azure/values.yaml --set image.tag=ci
          --set api.workloadIdentity.clientId=00000000-0000-0000-0000-000000000000
          --set email.fromAddress=DoNotReply@example.azurecomm.net
          --set dataProtection.keyVaultKeyUri=https://kv-medapp-ci.vault.azure.net/keys/medapp-data-protection

      # Azure's values limit the API's egress by name (networkPolicy.fqdnEgress): the CiliumNetworkPolicy names the
      # relay, the vault and Microsoft Entra ID, and the API's NetworkPolicy no longer opens the internet beside it.
      - name: Render Azure's egress by name
        run: |
          helm template medapp deploy/helm/medapp --values deploy/azure/values.yaml --set image.tag=ci \
            --set api.workloadIdentity.clientId=00000000-0000-0000-0000-000000000000 \
            --set email.fromAddress=DoNotReply@example.azurecomm.net \
            --set dataProtection.keyVaultKeyUri=https://kv-medapp-ci.vault.azure.net/keys/medapp-data-protection \
            > azure.yaml
          grep -q '^kind: CiliumNetworkPolicy$' azure.yaml
          for name in smtp.azurecomm.net kv-medapp-ci.vault.azure.net login.microsoftonline.com; do
            grep -q "matchName: \"$name\"" azure.yaml || { echo "No FQDN rule for $name."; exit 1; }
          done
          if grep -q '0\.0\.0\.0/0' azure.yaml; then
            echo "The API's NetworkPolicy still allows the internet beside egress by name."; exit 1
          fi
          # Under the managed domain's quota of 10 emails an hour.
          grep -A1 'name: Email__MaxPerHour' azure.yaml | grep -q 'value: "8"' || { echo "No hourly email cap under the quota."; exit 1; }

      - name: Lint with Mailpit
        run: helm lint --strict deploy/helm/medapp --set image.tag=ci --set mailpit.enabled=true

      - name: Lint with an external mail server and its password from a Secret
        run: >-
          helm lint --strict deploy/helm/medapp --set image.tag=ci
          --set email.smtp.host=smtp.example.com --set email.fromAddress=medapp@example.com
          --set email.smtp.auth.enabled=true --set email.smtp.auth.existingSecret=medapp-email

      # The page server inside the API's container (the API starts Node), instead of in a container of its own.
      - name: Lint with the page server in the API's container
        run: helm lint --strict deploy/helm/medapp --set image.tag=ci --set api.pageServer.enabled=false

      # The Azure infrastructure (deploy/azure): compiled and linted, so a broken template fails here rather than on a
      # deploy. Placeholder passwords; nothing is deployed. The Azure CLI comes with the runner image.
      - name: Build the Bicep
        env:
          MEDAPP_SQL_ADMIN_PASSWORD: ci
          MEDAPP_FIRST_ADMIN_PASSWORD: ci
          MEDAPP_BACKPLANE_PASSWORD: ci
        run: |
          az bicep install
          az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
          az bicep lint --file deploy/azure/main.bicep
          az bicep build-params --file deploy/azure/main.bicepparam --stdout > /dev/null

      - name: Render
        run: helm template medapp deploy/helm/medapp --values deploy/kind/values.yaml --set image.tag=ci > /dev/null

      # The cluster services (Traefik, cert-manager, External Secrets and Argo CD), rendered at the versions
      # deploy/kind/up.sh and deploy/azure/bootstrap.sh install (deploy/versions.sh), with every values file and
      # --set value those scripts give them. A values file that doesn't match a chart's schema fails here, not halfway
      # through setting up a cluster.
      - name: Add the cluster services' chart repositories
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Render Traefik with kind's and Azure's values
        run: |
          source deploy/versions.sh
          for values in deploy/kind/traefik-values.yaml deploy/azure/traefik-values.yaml; do
            helm template traefik traefik/traefik --version "$traefik_version" --namespace traefik \
              --values "$values" > /dev/null
          done

      - name: Render cert-manager
        run: |
          source deploy/versions.sh
          helm template cert-manager jetstack/cert-manager --version "$cert_manager_version" --namespace cert-manager \
            --set crds.enabled=true > /dev/null

      - name: Render External Secrets as kind and Azure install it
        run: |
          source deploy/versions.sh
          helm template external-secrets external-secrets/external-secrets --version "$external_secrets_version" \
            --namespace external-secrets > /dev/null
          helm template external-secrets external-secrets/external-secrets --version "$external_secrets_version" \
            --namespace external-secrets \
            --set-string "serviceAccount.annotations.azure\.workload\.identity/client-id=00000000-0000-0000-0000-000000000000" \
            --set-string "podLabels.azure\.workload\.identity/use=true" > /dev/null

      - name: Render Argo CD with kind's and Azure's values
        run: |
          source deploy/versions.sh
          for values in deploy/argocd/argocd-values.yaml deploy/azure/argocd-values.yaml; do
            helm template argocd argo/argo-cd --version "$argocd_version" --namespace argocd \
              --values "$values" > /dev/null
          done

  # The integration tests (MedApp.IntegrationTests): the real API in memory (WebApplicationFactory) against SQL Server
  # 2022 and Azurite in Docker (Testcontainers), which the runner has. Only in the full tier. They're split across
  # runners by namespace, each with containers of its own: the migrations are applied at the start and the data reset
  # between tests. Each shard pulls the SQL Server image (about 1.6 GB) first.
  #   - SHARD_1 and SHARD_2 name the namespaces (under MedApp.IntegrationTests) the first two shards run, balanced by
  #     how long they take (from a run's log, November 2026: about 2 minutes of tests each).
  #   - The last shard runs every test that isn't in one of those namespaces, by a filter built from the same two
  #     lists. So no test can fall between shards: a new namespace, or a name mistyped here, runs in the last one.
  integration-shards:
    name: integration-tests (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # It runs the pull request's own code: it needs no more than to read the repository.
    permissions:
      contents: read
    strategy:
      # Every shard reports, so one failure doesn't hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_1: Auth Api Appointments
      SHARD_2: Tools Migrations Infrastructure Attachments
    outputs:
      tests-1: ${{ steps.run.outputs.tests-1 }}
      tests-2: ${{ steps.run.outputs.tests-2 }}
      tests-3: ${{ steps.run.outputs.tests-3 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        id: run
        shell: bash   # with pipefail, so a failed test run isn't hidden by tee
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Shards 1 and 2: the tests in their namespaces. The last: the tests in none of those.
          case "$SHARD" in
            1) namespaces=$SHARD_1; match='~'; join='|' ;;
            2) namespaces=$SHARD_2; match='~'; join='|' ;;
            *) namespaces="$SHARD_1 $SHARD_2"; match='!~'; join='&' ;;
          esac
          filter=''
          for namespace in $namespaces; do
            filter="${filter:+$filter$join}FullyQualifiedName${match}MedApp.IntegrationTests.$namespace."
          done
          echo "Filter: $filter"
          dotnet test MedApp.IntegrationTests --configuration Release --logger "console;verbosity=normal" --filter "$filter" \
            | tee "$RUNNER_TEMP/integration-tests.log"
          # How many ran, for the integration-tests job to add up. A shard that ran none has a broken filter.
          tests=$(sed -n -E 's/^ *Total tests: ([0-9]+).*/\1/p' "$RUNNER_TEMP/integration-tests.log" | tail -n 1)
          echo "tests-$SHARD=${tests:-0}" >> "$GITHUB_OUTPUT"
          echo "Shard $SHARD ran ${tests:-0} tests." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${tests:-0}" -gt 0 ]

  # The required check for the integration tests: the shards report as "integration-tests (shard 1)", so this job
  # keeps the name main's ruleset requires. It passes only if every shard passed; a failed, cancelled or skipped shard
  # fails it. It also adds up how many tests the shards ran. When the tier has no integration tests, this job is
  # skipped with them (which passes the check), rather than wait for a runner to say so.
  integration-tests:
    needs: [changes, integration-shards]
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the shards did what the tier asks
        env:
          GOT: ${{ needs.integration-shards.result }}
          TESTS: ${{ needs.integration-shards.outputs.tests-1 }} + ${{ needs.integration-shards.outputs.tests-2 }} + ${{ needs.integration-shards.outputs.tests-3 }}
        run: |
          echo "The shards: $GOT (needed: success)"
          [ "$GOT" = success ]
          echo "Integration tests run: $TESTS = $((TESTS))" | tee -a "$GITHUB_STEP_SUMMARY"

  unit-tests:
    needs: changes
    # Whenever the pull request changed .NET code (light and full tiers). It runs if `changes` gave no answer.
    if: ${{ !cancelled() && needs.changes.outputs.dotnet != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Local checks build only the projects a change touches (AGENTS.md, Testing a change), so this is the one place the
      # whole solution is built, the deprecated Blazor client and the AppHost included.
      - name: Build the solution
        run: dotnet build MedApp.sln --configuration Release

      # The dev MCP tool (tools/MedApp.DevMcp) isn't in MedApp.sln, so nothing else builds it. It once stopped
      # compiling, unnoticed, when an Application command it calls changed.
      - name: Build the dev MCP tool
        run: dotnet build tools/MedApp.DevMcp --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test MedApp.UnitTests \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
      
      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # v5.6.0
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'Html;MarkdownSummaryGithub;Cobertura'
          # The API counts (controllers, middleware, auth, server rendering); the Aspire service defaults are wiring.
          assemblyfilters: '+MedApp.*;-MedApp.Contracts;-MedApp.ServiceDefaults'
          # Generated code (obj/: OpenAPI XML comments, regex source generators) isn't ours to test.
          filefilters: '-**/Migrations/*.cs;-**/Program.cs;-**/Startup.cs;-**/obj/**'
          classfilters: >-
            -*Command;-*Query;-*Result;-*ServiceExtensions;-*ApplicationBuilderExtensions;-*Configuration;-*Settings;-*DbContext;-*Repository;-*Repositories.*;-MedApp.Infrastructure.Common.Authentication.SessionService;-MedApp.Infrastructure.Common.Identity.IdentityTransactions

      
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report
      
      - name: Create detailed coverage comment
        run: |
          echo "## 📊 Coverage Report" > coverage-details.md
          echo "" >> coverage-details.md
          cat coverage-report/SummaryGithub.md >> coverage-details.md
          echo "" >> coverage-details.md
          echo "## 📉 Classes Below 80% Coverage" >> coverage-details.md

          python3 << 'EOF'
          import xml.etree.ElementTree as ET

          EXCLUDED_PATTERNS = [
              ".Domain.",
              ".Repositories.",
              "Repository",
          ]

          def is_excluded(name):
              return any(p in name for p in EXCLUDED_PATTERNS)

          tree = ET.parse('coverage-report/Cobertura.xml')
          root = tree.getroot()

          rows = []

          for package in root.findall('.//package'):
              for cls in package.findall('.//class'):
                  class_name = cls.get('name')
                  if not class_name or is_excluded(class_name):
                      continue

                  line_rate = float(cls.get('line-rate', 0)) * 100
                  branch_rate = float(cls.get('branch-rate', 0)) * 100 if cls.get('branch-rate') else 100

                  if line_rate < 80:
                      rows.append((class_name, line_rate, branch_rate))

          rows.sort(key=lambda x: x[1])

          # Collapsible like ReportGenerator's sections. The blank line after
          # <summary> is required for GitHub to render the table inside it.
          with open('coverage-details.md', 'a') as f:
              f.write(f"<details><summary>{len(rows)} classes below 80%</summary>\n\n")
              f.write("|**Class**|**Line**|**Branch**|\n")
              f.write("|:---|---:|---:|\n")
              if rows:
                  for name, line, branch in rows:
                      f.write(f"|`{name}`|{line:.1f}%|{branch:.1f}%|\n")
              else:
                  f.write("|*All classes above 80% coverage!* 🎉|-|-|\n")
              f.write("\n</details>\n")
          EOF


      - name: Upload coverage comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-coverage-comment
          path: coverage-details.md

  # One sticky PR comment for both: the .NET section from unit-tests, then MedApp.Web's from its merged summary. Only
  # in the full tier of a pull request (the light tier measures no coverage), and with only the side that ran when a
  # pull request changed one side.
  coverage-comment:
    needs: [changes, web-coverage, unit-tests]
    if: >-
      ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && needs.changes.outputs.coverage == 'true'
      && (needs.web-coverage.result == 'success' || needs.unit-tests.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # the comment
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.unit-tests.result == 'success' }}
        with:
          name: dotnet-coverage-comment

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.web-coverage.result == 'success' }}
        with:
          name: web-coverage
          path: web-coverage

      - name: Say which side didn't run
        env:
          DOTNET: ${{ needs.unit-tests.result }}
          WEB: ${{ needs.web-coverage.result }}
        run: |
          if [ "$DOTNET" != success ]; then
            printf '%s\n\n%s\n' '## 📊 Coverage Report' "The .NET tests didn't run: this pull request changes no .NET code." > coverage-details.md
          fi
          if [ "$WEB" != success ]; then
            printf '\n%s\n\n%s\n' '## 🌐 MedApp.Web Coverage' "The web tests didn't run: this pull request changes nothing in MedApp.Web." >> coverage-details.md
          fi

      - name: Add MedApp.Web coverage
        if: ${{ needs.web-coverage.result == 'success' }}
        run: |
          python3 << 'EOF'
          import json

          summary = json.load(open('web-coverage/coverage-summary.json'))
          total = summary.pop('total')

          def pct(metric):
              return f"{metric['pct']:.1f}% ({metric['covered']} of {metric['total']})"

          rows = sorted(
              ((path.split('MedApp.Web/', 1)[-1], m['lines']['pct'], m['branches']['pct'])
               for path, m in summary.items() if m['lines']['pct'] < 80),
              key=lambda r: r[1])

          with open('coverage-details.md', 'a', encoding='utf-8') as f:
              f.write("\n## 🌐 MedApp.Web Coverage\n\n")
              f.write("|||\n|:---|:---|\n")
              f.write(f"| **Line coverage:** | {pct(total['lines'])} |\n")
              f.write(f"| **Branch coverage:** | {pct(total['branches'])} |\n")
              f.write(f"| **Function coverage:** | {pct(total['functions'])} |\n")
              f.write(f"| **Statement coverage:** | {pct(total['statements'])} |\n\n")
              f.write(f"<details><summary>{len(rows)} files below 80%</summary>\n\n")
              f.write("|**File**|**Line**|**Branch**|\n|:---|---:|---:|\n")
              if rows:
                  for path, line, branch in rows:
                      f.write(f"|`{path}`|{line:.1f}%|{branch:.1f}%|\n")
              else:
                  f.write("|*All files above 80% coverage!* 🎉|-|-|\n")
              f.write("\n</details>\n")
          EOF

      - name: Comment PR with coverage summary
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          recreate: true
          path: coverage-details.md

  # The full suite on main (each push, and nightly) gates nothing: Publish deploys alongside it. So a failure has to be
  # loud. The run fails, and this job opens one issue, "Full suite failing on main", or adds a comment to it if it's
  # already open, with the jobs that failed, the commit and the run. The next run that passes closes it. A run
  # cancelled by a newer push says nothing: the newer run reports.
  main-report:
    needs: [changes, web, image, e2e, helm, integration-tests, unit-tests]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write  # open, comment on and close the issue
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Full suite failing on main'
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "- `\(.key)`: \(.value.result)"' <<< "$NEEDS")
          issue=$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -z "$failed" ]; then
            echo "Every job passed."
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The full suite passes again at $GITHUB_SHA ($EVENT): $RUN_URL"
            fi
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The full suite failed on \`main\` at $GITHUB_SHA ($EVENT): $RUN_URL" \
            "$failed" \
            "Pull requests run a lighter tier by default (AGENTS.md, CI), so this run is where what they skipped is found. \`web\` and \`integration-tests\` stand for their shards: the run has the detail. This issue closes itself when a run on \`main\` passes.")
          echo "$body"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
