name: Publish
# On each merge to main: build the API's image (MedApp.API/Dockerfile), push it to GHCR tagged with the commit, then
# deploy it to the kind environment by committing the tag to the env/kind branch, which Argo CD follows
# (deploy/argocd). main only changes through pull requests, so the tag lives on its own branch.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write   # push to env/kind
  packages: write   # push to GHCR
concurrency:
  # One at a time, in order, so env/kind always ends on the newest commit.
  group: publish
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/aliator/medapp-api
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all history, to merge main into env/kind

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MedApp.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # env/kind is main as of the last deploy plus the image to run (deploy/argocd/kind-image.yaml). Merge this
      # commit of main into it with the new tag, as one commit, so the chart and the image move together.
      - name: Deploy to kind (env/kind)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --quiet origin env/kind; then
            git switch --create env/kind FETCH_HEAD
            git merge --no-commit --no-ff "$GITHUB_SHA"
          else
            git switch --create env/kind "$GITHUB_SHA"
          fi
          cat > deploy/argocd/kind-image.yaml <<EOF
          # The image the kind environment runs: written by the Publish workflow, only on the env/kind branch.
          image:
            repository: ${IMAGE}
            tag: ${GITHUB_SHA}
            pullPolicy: IfNotPresent
          EOF
          git add --all
          # A re-run for the same commit has nothing to change.
          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then exit 0; fi
          git commit --message "Deployed medapp-api ${GITHUB_SHA::7} to kind"
          git push origin env/kind
