{{- $name := printf "%s-api" (include "medapp.fullname" .) }}
{{- $smtpHost := include "medapp.externalSmtpHost" . }}
{{- if and .Values.mailpit.enabled .Values.email.smtp.host }}
{{- fail "Set email.smtp.host or mailpit.enabled, not both: with Mailpit, the chart points the API at it." }}
{{- end }}
{{- if and .Values.email.smtp.auth.enabled (not .Values.email.smtp.auth.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- fail "email.smtp.auth.enabled needs the mail server's password from email.smtp.auth.existingSecret or externalSecrets." }}
{{- end }}
{{- with .Values.api.workloadIdentity.clientId }}
# The API's own service account, for Microsoft Entra Workload ID: AKS gives the pods a token for the managed identity
# named here (the identity's federated credential names this account). Still no Kubernetes API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
automountServiceAccountToken: false
---
{{- end }}
{{- /* The API's ports: the app (the Service's target, and the page server's way back), and its health checks. */}}
{{- $apiPort := 8080 }}
{{- $apiHealthPort := 8081 }}
{{- /*
The page server (api.pageServer): a second container in the API's pod, which shares its network, so the two talk on
127.0.0.1. Pages on one port, on loopback only; its health on another, for the kubelet's liveness probe.
*/}}
{{- $pagesPort := 8082 }}
{{- $pagesHealthPort := 8083 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "medapp.selectorLabels" (list . "api") | nindent 4 }}
  # Only the app's port: the health port (8081) is for the kubelet's probes, never the Service or the ingress.
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # Under Argo CD: after the migrations (wave 1), so a new API never runs on an old schema.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "medapp.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "medapp.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- if .Values.api.workloadIdentity.clientId }}
        # AKS's workload identity webhook adds the identity's token (a projected volume) and its AZURE_* variables.
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        # kubectl logs and exec mean the API unless -c pages says otherwise.
        kubectl.kubernetes.io/default-container: api
        {{- if .Values.api.pageServer.enabled }}
        # With a workload identity (api.workloadIdentity.clientId, for the data protection key), Azure's webhook
        # would put its token into every container: never into the page server's, which must hold no secrets. Without
        # one, the annotation does nothing.
        azure.workload.identity/skip-containers: pages
        {{- end }}
    spec:
      {{- if .Values.api.workloadIdentity.clientId }}
      serviceAccountName: {{ $name }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own non-root user (APP_UID in the .NET images).
      {{- include "medapp.podSecurity" (list . 1654) | nindent 6 }}
      # No variables naming every Service in the namespace: neither container uses them, and the page server gets
      # only the settings below.
      enableServiceLinks: false
      {{- if gt (int .Values.api.replicas) 1 }}
      # The copies on different nodes where there are enough, so losing one node doesn't take them all. A preference,
      # not a rule (ScheduleAnyway): a one-node cluster, such as kind, still runs every copy.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "medapp.selectorLabels" (list . "api") | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "medapp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "medapp.containerSecurityContext" . | nindent 12 }}
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.dbSecretName" . }}
                  key: connection-string
            {{- if .Values.backplane.enabled }}
            # Live notifications through the backplane, so every copy of the API reaches every browser.
            - name: ConnectionStrings__SignalRBackplane
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.backplaneSecretName" . }}
                  key: connection-string
            {{- end }}
            {{- if include "medapp.attachmentsStorage" . }}
            # File storage for attachments (Azure Blob Storage, or Azurite). Without it, uploads and downloads answer
            # 503. Optional, so a missing Secret (say, a secret store entry not made yet) means no file storage, not an
            # API that can't start.
            - name: ConnectionStrings__Attachments
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.attachmentsSecretName" . }}
                  key: connection-string
                  optional: true
            - name: Attachments__Container
              value: {{ .Values.attachments.container | quote }}
            {{- end }}
            # The app on one port, and /health and /alive on the other only (MedApp.ServiceDefaults).
            - name: ASPNETCORE_HTTP_PORTS
              value: "{{ $apiPort }};{{ $apiHealthPort }}"
            - name: HealthChecks__Port
              value: "{{ $apiHealthPort }}"
            # Behind the ingress: take the client's scheme and address from its X-Forwarded-* headers.
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            {{- if .Values.mailpit.enabled }}
            # Email goes to the chart's Mailpit, which catches it all (no TLS, no sign-in: it never leaves the cluster).
            - name: Email__Smtp__Host
              value: {{ include "medapp.mailpitName" . | quote }}
            - name: Email__Smtp__Port
              value: "1025"
            - name: Email__Smtp__Security
              value: None
            {{- else if $smtpHost }}
            # Email goes to this mail server.
            - name: Email__Smtp__Host
              value: {{ $smtpHost | quote }}
            - name: Email__Smtp__Port
              value: {{ .Values.email.smtp.port | toString | quote }}
            {{- with .Values.email.smtp.security }}
            - name: Email__Smtp__Security
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if or .Values.mailpit.enabled $smtpHost }}
            {{- with .Values.email.smtp.timeoutSeconds }}
            - name: Email__Smtp__TimeoutSeconds
              value: {{ . | toString | quote }}
            {{- end }}
            {{- if .Values.email.smtp.auth.enabled }}
            {{- if .Values.email.smtp.username }}
            - name: Email__Smtp__Username
              value: {{ .Values.email.smtp.username | quote }}
            {{- else }}
            - name: Email__Smtp__Username
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.emailSecretName" . }}
                  key: username
            {{- end }}
            - name: Email__Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "medapp.emailSecretName" . }}
                  key: password
            {{- end }}
            {{- end }}
            {{- with .Values.email.fromAddress | default (ternary "medapp@localhost" "" .Values.mailpit.enabled) }}
            - name: Email__FromAddress
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.email.fromName }}
            - name: Email__FromName
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.email.maxPerHour }}
            # The most emails this copy sends in an hour, notices first.
            - name: Email__MaxPerHour
              value: {{ . | quote }}
            {{- end }}
            {{- with include "medapp.emailLinkBaseUrl" . }}
            # Links in emails start with this; never with a request's Host header.
            - name: Email__LinkBaseUrl
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dataProtection.keyVaultKeyUri }}
            # The data protection keys (in the database) are wrapped with this Key Vault key.
            - name: DataProtection__KeyVaultKeyUri
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.pageServer.enabled }}
            # Pages are rendered by the pages container beside this one, not by a Node the API starts itself.
            - name: Ssr__ServerUrl
              value: "http://127.0.0.1:{{ $pagesPort }}"
            {{- end }}
            {{- with .Values.api.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $apiPort }}
            - name: health
              containerPort: {{ $apiHealthPort }}
          lifecycle:
            # Keep serving for a moment after being told to stop, while the ingress stops sending requests here.
            # Without it, a rollout fails the odd request sent to the old pod as it shuts down.
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: health
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; .NET (and Node, when the API starts it) get a scratch folder. Uploads
            # pass through it too: the API streams each file (up to 20 MiB) into a temporary file here while it checks
            # it, deleted straight after. The pages container has no scratch folder of its own and doesn't share this.
            - name: tmp
              mountPath: /tmp
        {{- if .Values.api.pageServer.enabled }}
        # The page server (MedApp.Web/server/server.mjs), from the same image. It renders the pages the API forwards to
        # it, calling the API back on 127.0.0.1 with the visitor's cookie for their data. A container of its own, so
        # code running in Node (a rendering flaw, a compromised npm package) can't reach the API's process or its
        # environment: it gets none of the API's secrets or settings, only what's below, and runs as a user of its own.
        - name: pages
          image: {{ include "medapp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/app/ssr/server.mjs"]
          securityContext:
            {{- include "medapp.containerSecurityContext" . | nindent 12 }}
            # Not the API's user (1654): even if the pod ever shared its process namespace, the API's /proc entries
            # (its environment) would stay out of reach.
            runAsUser: 1655
            runAsGroup: 1655
          env:
            # Pages on loopback only: just the API, in this pod, reaches them.
            - name: HOST
              value: "127.0.0.1"
            - name: PORT
              value: "{{ $pagesPort }}"
            # Run as a service of its own: a supervisor that keeps the page server running in a worker process, and
            # answers GET /alive on every interface for the probe below (the network policy lets no one else reach it).
            - name: HEALTH_PORT
              value: "{{ $pagesHealthPort }}"
            # The API, for a page's data: the app's port, in this pod.
            - name: MEDAPP_API_URL
              value: "http://127.0.0.1:{{ $apiPort }}"
            - name: NODE_ENV
              value: production
          ports:
            - name: pages-health
              containerPort: {{ $pagesHealthPort }}
          lifecycle:
            # As the API does: keep rendering while the ingress stops sending requests here, then finish the pages
            # being sent and exit (server.mjs handles SIGTERM).
            preStop:
              sleep:
                seconds: 5
          # No readiness or startup probe: either would make the API's pod unready, and so out of service, whenever
          # the page server is, where the API can carry on with pages rendered in the browser. The page server
          # restarts its own worker if it stops or gets stuck (server.mjs, supervise), so the container keeps running;
          # the liveness probe restarts it only if the supervisor itself stops answering.
          livenessProbe:
            httpGet:
              path: /alive
              port: pages-health
            periodSeconds: 20
            timeoutSeconds: 5
            # A stuck event loop can't run the SIGTERM handler: don't wait the pod's 30 seconds for it.
            terminationGracePeriodSeconds: 5
          resources:
            {{- toYaml .Values.api.pageServer.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            # The API's own scratch folder: room for dozens of 20 MiB uploads at once beside what .NET (and Node, when
            # the API starts it) keep here. A pod whose scratch folder outgrows this is evicted, so it errs on the
            # large side; it's a limit, not space set aside.
            sizeLimit: 1Gi
{{- if gt (int .Values.api.replicas) 1 }}
{{- if not .Values.backplane.enabled }}
{{- fail "api.replicas above 1 needs backplane.enabled: without it, live notifications reach only the browsers on the copy that sends them." }}
{{- end }}
---
# Keeps at least one copy of the API running while nodes are drained (upgrades, scaling down).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "medapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "medapp.selectorLabels" (list . "api") | nindent 6 }}
{{- end }}
