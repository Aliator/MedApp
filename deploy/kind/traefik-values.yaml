# Traefik as the kind cluster's ingress controller (installed by up.sh). Its entry points are on node ports 30080
# (http) and 30443 (https), which cluster.yaml maps to http://localhost:8080 and https://localhost:8443. The https
# certificate is self-signed (cert-manager, local-cluster.yaml). Plain http works too: browsers treat localhost as
# secure, so they keep the session cookie (Secure).
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    # Ingresses report localhost as their address. Behind a NodePort service Traefik would report none, and Argo CD
    # counts an Ingress without an address as not yet healthy, so it would never finish syncing.
    publishedService:
      enabled: false
    ingressEndpoint:
      hostname: localhost
