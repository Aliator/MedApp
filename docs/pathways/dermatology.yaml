        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 306206005 | Referral to service
        notes: "Urgent suspected cancer referral for excision biopsy at the hospital: a possible melanoma is removed whole, not biopsied here."

    addableRoutes: []

  - template: Skin cancer surveillance
    retentionClass: Oncology
    summary: Regular skin checks after hospital treatment for skin cancer, or for people at high risk, following the hospital's follow-up plan.
    start: triage
    stages:
      - id: triage
        name: Triage
        owner: clinic
        kind: step
        visit: none
        next: [skin-check]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: null
        mdt: false
        consult: null
        snomed: 225390008 | Triage
        notes: Record the hospital's diagnosis, treatment and follow-up plan, including its review interval and end date.

      - id: skin-check
        name: Skin check
        owner: clinic
        kind: assessment
        visit: required
        next: null
        outcomes:
          - name: No new concerns
            next: [skin-check]
          - name: Plan complete
            next: [care-plan]
          - name: Sun damage found
            next: [gp-letter]
          - name: "New lesion: biopsy"
            next: [take-biopsy]
          - name: Suspected melanoma
            next: [refer-hospital-urgent]
          - name: Suspected recurrence
            next: [refer-hospital-urgent]
        endOutcome: null
        optional: false
        needsLetter: null
        needsConsent: false
        repeat: Every 3 to 12 months, as the hospital's plan sets; stops when the plan ends.
        mdt: false
        consult: null
        snomed: null
        notes: Scar, lymph nodes and a full skin check. Intervals follow the hospital's plan (for example NICE NG14 for melanoma), recorded as given.

      - id: gp-letter
        name: Letter to GP
        owner: clinic
        kind: step
        visit: none
        next: [skin-check]
        outcomes: null
        endOutcome: null
        optional: false
        needsLetter: Letter to GP
        needsConsent: false
        repeat: null
        mdt: false
